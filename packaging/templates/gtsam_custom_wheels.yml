# Template only.
# Move this file into .github/workflows/ when the patched GTSAM branch and
# wrapper API are stable enough to freeze for the course release.

name: Build Custom GTSAM Wheels

on:
  workflow_dispatch:
    inputs:
      gtsam_repo:
        description: "Fork to build from, for example owner/gtsam"
        required: true
        default: "your-org/gtsam"
      gtsam_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: "feature/custom-python-wrapper"
      package_name:
        description: "Published wheel package name"
        required: true
        default: "gtsam-ttk4250"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cibw_archs: x86_64
          - os: macos-13
            cibw_archs: x86_64
          - os: macos-14
            cibw_archs: arm64
          - os: windows-latest
            cibw_archs: AMD64

    runs-on: ${{ matrix.os }}

    env:
      CIBW_BUILD: cp311-*
      CIBW_ARCHS: ${{ matrix.cibw_archs }}
      PACKAGE_NAME: ${{ inputs.package_name }}

    steps:
      - name: Check out thesis repo
        uses: actions/checkout@v4

      - name: Check out patched GTSAM fork
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.gtsam_repo }}
          ref: ${{ inputs.gtsam_ref }}
          path: external/gtsam

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install wheel build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install cibuildwheel build

      - name: Prepare packaging project
        run: |
          echo "TODO: add the packaging wrapper project that turns the patched"
          echo "GTSAM checkout into a Python wheel build."

      - name: Build wheels
        run: |
          echo "TODO: run cibuildwheel against the packaging project."
          echo "Common end state:"
          echo "  python -m cibuildwheel <package-dir> --output-dir wheelhouse"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

      # Add a release upload step later once the wheel naming and release
      # process are finalized.
