name: example_config
description: Example SLAM configuration for testing
seed: 42
profilinfg_enabled: false
simulation:
  dt: 0.1
  duration: 20.0
  init_pose:
  - 0.0
  - 0.0
  - 0.0
  noise:
    x_std: 0.1
    y_std: 0.1
    theta_std_deg: 0.1
    bearing_std_deg: 1.0
    range_std: 0.2
    x0_std: 0.05
    y0_std: 0.05
    theta0_std_deg: 1.0
  path_type: circle
  num_poses: 10
  num_landmarks: 15
  landmark_bounds:
  - -50.0
  - 50.0
  - -50.0
  - 50.0
  max_sensor_range: 15.0
  sensor_fov_deg: 360.0
inference:
  algorithm: isam2
  prior_pose:
  - 0.0
  - 0.0
  - 0.0
  noise:
    x_std: 0.1
    y_std: 0.1
    theta_std_deg: 0.1
    bearing_std_deg: 1.0
    range_std: 0.2
    x0_std: 0.05
    y0_std: 0.05
    theta0_std_deg: 1.0
  landmark_manager:
    M: 3
    'N': 4
    gate: 0.1
  association:
    method: jcbb
    alpha_individual: 0.999
    alpha_joint: 0.9999
    range_gate: 50.0
    fov_gate_deg: 250.0
visualization:
  output_dir: ./results
  save_format: svg
