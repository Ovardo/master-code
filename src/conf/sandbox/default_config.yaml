name: example_config
description: Example SLAM configuration for testing
seed: 42
simulation:
  dt: 0.1
  duration: 20.0
  init_pose:
  - 0.0
  - 0.0
  - 0.0
  noise:
    x_std: 0.1
    y_std: 0.1
    theta_std_deg: 0.1
    bearing_std_deg: 1.0
    range_std: 0.2
    x0_std: 0.05
    y0_std: 0.05
    theta0_std_deg: 3.0
  path_type: circle
  num_poses: 10
  num_landmarks: 15
  landmark_bounds:
  - -50.0
  - 50.0
  - -50.0
  - 50.0
  max_sensor_range: 15.0
  sensor_fov_deg: 360.0
inference:
  algorithm: isam2
  noise:
    x_std: 0.1
    y_std: 0.1
    theta_std_deg: 0.1
    bearing_std_deg: 1.0
    range_std: 0.2
    x0_std: 0.05
    y0_std: 0.05
    theta0_std_deg: 3.0
  init_pose:
  - 0.0
  - 0.0
  - 0.0
  dead_reckoning: false
  association_type: jcbb
  alpha_individual: 0.999
  alpha_joint: 0.9999
  local_filtering_range: 30.0
  sensor_offset:
  - 0.0
  - 0.0
visualization:
  enabled: true
  real_time: true
  update_interval: 10
  figure_size:
  - 12
  - 8
  show_trajectory: true
  show_landmarks: true
  show_uncertainty: true
  show_observations: false
  save_plots: false
  output_dir: ./results
  save_format: png
