name: example_config
description: Example SLAM configuration for testing
seed: 42

simulation:
  # dt: 0.1
  # duration: 20.0

  init_pose:
  - 0.0
  - 0.0
  - 0.0

  noise:
    x_std: 0.1
    y_std: 0.1
    theta_std_deg: 0.1
    bearing_std_deg: 1.0
    range_std: 0.4
    x0_std: 0.05
    y0_std: 0.05
    theta0_std_deg: 3.0

  # path_type: circle
  # num_poses: 10

  # num_landmarks: 15
  # landmark_bounds:
  # - -50.0
  # - 50.0
  # - -50.0
  # - 50.0

  max_sensor_range: 15.0
  sensor_fov_deg: 360.0

inference:

  algorithm: isam2 # "isam2", "batch"

  prior_pose:
  - 0.0
  - 0.0
  - 0.0
      
  noise:
    x_std: 0.05 # 0.1
    y_std: 0.05 # 0.1
    theta_std_deg: 0.1 # 0.2
    bearing_std_deg: 0.5   
    range_std: 0.2 # 0.2
    x0_std: 0.001 # 0.05
    y0_std: 0.001 # 0.05
    theta0_std_deg: 0.005 #0.5

  M: 3 # hits to confirm a landmark
  N: 4 # time steps to keep a tentative landmark
  association_gate: 0.5 # 1.5 # ecludian distance threshold for associating unassociated measurements to existing tentative landmarks

  association_method: "jcbb" # "jcbb ("maximum_likelihood" & "ground_truth" to be implemented)
  alpha_individual: 0.9999
  alpha_joint: 0.99999

  range_gate: 45 
  fov_gate_deg: 220.0

  sensor_offset: # not used
  - 3.78
  - 0.5

visualization: # not used? 
  # enabled: true
  # real_time: true
  # update_interval: 10
  figure_size:
  - 12
  - 8
  show_trajectory: true
  show_landmarks: true
  show_uncertainty: true
  show_observations: false
  save_plots: false
  output_dir: ./results
  save_format: png
